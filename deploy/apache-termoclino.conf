# Termoclino — configurazione Apache (URL puliti, cartelle non pubbliche,
# tunnel WebSocket verso il server di gioco).
#
# Installata da deploy/00-bootstrap.sh (o da deploy/01-apache.sh) in
# /etc/apache2/conf-available/termoclino.conf e abilitata con a2enconf: non
# tocca i vhost, che su questa macchina sono condivisi con altri siti — e uno
# di loro manda un HSTS di un anno, che e' il motivo per cui il server di gioco
# sta sotto un sottopercorso (/termoclino/ws) e non su una porta sua.
#
# !! ATTENZIONE AL PERCORSO !!
# Il DocumentRoot e' /var/www/html, che e' un SYMLINK a /data/html. Apache
# abbina i blocchi <Directory> sul percorso COL SYMLINK NON RISOLTO: scrivere
# <Directory /data/html/termoclino> compila, supera il configtest, e non si
# applica mai (lezione gia' pagata da Cento Gradini).

# --- Il server di gioco ----------------------------------------------------------
# Contesto di server: vale per tutti i vhost, HTTP e HTTPS. Il browser usa
# wss://<host>/termoclino/ws; il server Node ascolta solo su 127.0.0.1.
<IfModule mod_proxy_wstunnel.c>
    ProxyPass        /termoclino/ws  ws://127.0.0.1:8095/
    ProxyPassReverse /termoclino/ws  ws://127.0.0.1:8095/
</IfModule>

# --- L'applicazione PHP ------------------------------------------------------------
<Directory /var/www/html/termoclino>
    AllowOverride None
    Options -Indexes +FollowSymLinks
    Require all granted

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /termoclino/

        # I file veri (fogli di stile, script, immagini) si servono da soli.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </IfModule>
</Directory>

# Cartelle che non devono mai uscire dal server. Il criterio e' per suffisso di
# percorso e non per prefisso assoluto, sempre per la storia del symlink.
<DirectoryMatch "/termoclino/(src|db|bin|config|deploy|docs|storage|tests|views)(/|$)">
    Require all denied
</DirectoryMatch>

# La grafica e i suoni originali del 1989 non si raggiungono per indirizzo
# diretto (decisione D4): li serve PHP su /termoclino/originali/..., solo a
# chi ha fatto accesso.
<DirectoryMatch "/termoclino/assets/originali(/|$)">
    Require all denied
</DirectoryMatch>

# File sparsi che non vanno serviti: sorgenti, dump, diari, esempi di config.
<FilesMatch "(^\.|\.(md|sql|lock|log|dist|example|ini|tsv|sh|env)$)">
    Require all denied
</FilesMatch>
