# Termoclino — server di gioco in esercizio su il server.
#
#   docker compose -f server/compose.yaml up -d --build
#
# Rete dell'host: il server ascolta su 127.0.0.1:8095 della macchina, dove
# Apache lo raggiunge (ProxyPass /termoclino/ws) e PHP ne legge la sonda; da
# F1 raggiungera' MariaDB in locale allo stesso modo. Niente porte esposte
# verso l'esterno: TERMOCLINO_HOST resta 127.0.0.1.
#
# Il riavvio lo fa Docker (restart: unless-stopped), quindi niente unita'
# systemd e niente sudo per tenerlo in vita.
services:
  termoclino-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: termoclino-server:latest
    container_name: termoclino-server
    restart: unless-stopped
    network_mode: host
    env_file: /data/termoclino-config/server.env
    # La versione la passa deploy/02-pubblica.sh (il commit pubblicato) e
    # prevale su quella del file di ambiente.
    environment:
      TERMOCLINO_VERSIONE: ${TERMOCLINO_VERSIONE:-sconosciuta}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    # Le istantanee della verita' delle partite (gzip, una riga JSON al secondo
    # di gioco: il materiale dei replay) vanno su un volume con nome, l'unico
    # posto scrivibile oltre a /tmp. Per non registrarle: TERMOCLINO_ISTANTANEE=-
    # nel server.env. In F1 nessuno le cancella: circa 200 KB per ora di gioco
    # con due battelli in palestra.
    volumes:
      - termoclino-istantanee:/var/lib/termoclino/istantanee
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  termoclino-istantanee:
